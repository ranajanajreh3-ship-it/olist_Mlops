name: CI/CD                      #pipeline name 

on:                              #When I push run the pipeline 
  push:

jobs:                           #Github executes a specific set of tasks 
  quality:                      # github ensures the code quality
    runs-on: ubuntu-latest      # the eniviroment where the job executes 
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5 
        with:
         python-version: "3.13"
      - name: Install dependencies
        run: |
         pip install dvc
         pip install -r requirements/requirements.txt
         pip install -r requirements/requirements-dev.txt
      - name: Configure DVC
        run: |
         dvc remote modify --local dagshub auth basic
         dvc remote modify --local dagshub user ${{ secrets.DAGSHUB_USER }}
         dvc remote modify --local dagshub password ${{ secrets.DAGSHUB_TOKEN }}

      - name: Pull DVC artifacts
        run: dvc pull
      - name: Lint                 #Lint looks for problems or errors in Python's writing style.
        run: ruff check .  
      - name: Format check
        run: black --check .       #black ensure that the Python code format is neat and rules-compliant.
      - name: Tests
        run: PYTHONPATH=. pytest  